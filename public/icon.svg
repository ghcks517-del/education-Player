<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- TV Screen Gradient (Hanwha Signature Warm Orange) -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="50%" stop-color="#F37321" />
      <stop offset="100%" stop-color="#D92D20" />
    </linearGradient>

    <!-- Metallic Antenna Gradient -->
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Subtle Screen Glare -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#F37321" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6" />

  <!-- TV Antennas -->
  <!-- Left Antenna -->
  <line x1="216" y1="116" x2="148" y2="48" stroke="url(#antennaGrad)" stroke-width="12" stroke-linecap="round" />
  <circle cx="144" cy="44" r="12" fill="#F37321" stroke="#FFFFFF" stroke-width="3" />

  <!-- Right Antenna -->
  <line x1="296" y1="116" x2="364" y2="48" stroke="url(#antennaGrad)" stroke-width="12" stroke-linecap="round" />
  <circle cx="368" cy="44" r="12" fill="#F37321" stroke="#FFFFFF" stroke-width="3" />

  <!-- TV Antenna Base Hub -->
  <ellipse cx="256" cy="118" rx="36" ry="12" fill="#334155" />

  <!-- TV Body (Main Casing) -->
  <rect x="68" y="112" width="376" height="272" rx="36" fill="#1E293B" stroke="#475569" stroke-width="8" filter="url(#glow)" />

  <!-- TV Screen Bezel -->
  <rect x="92" y="134" width="276" height="228" rx="22" fill="#020617" stroke="#334155" stroke-width="4" />

  <!-- TV Display / Screen (Vibrant Orange Glow) -->
  <rect x="100" y="142" width="260" height="212" rx="16" fill="url(#screenGrad)" />

  <!-- Screen Diagonal Glare Effect -->
  <path d="M100 142 L240 142 L120 354 L100 354 Z" fill="url(#glareGrad)" />

  <!-- TV Screen Content: Video Play Icon (▶) with Safety Star Accent -->
  <g transform="translate(230, 248)">
    <!-- Play Triangle -->
    <polygon points="-24,-34 36,0 -24,34" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))" />
  </g>

  <!-- TV Right Panel: Speaker & Controls -->
  <g transform="translate(382, 140)">
    <!-- Knob 1 (Channel) -->
    <circle cx="28" cy="28" r="18" fill="#334155" stroke="#64748B" stroke-width="3" />
    <circle cx="28" cy="28" r="6" fill="#F37321" />

    <!-- Knob 2 (Volume) -->
    <circle cx="28" cy="78" r="18" fill="#334155" stroke="#64748B" stroke-width="3" />
    <circle cx="28" cy="78" r="6" fill="#F37321" />

    <!-- Speaker Grille Slots -->
    <rect x="10" y="128" width="36" height="6" rx="3" fill="#334155" />
    <rect x="10" y="144" width="36" height="6" rx="3" fill="#334155" />
    <rect x="10" y="160" width="36" height="6" rx="3" fill="#334155" />
    <rect x="10" y="176" width="36" height="6" rx="3" fill="#334155" />
    <rect x="10" y="192" width="36" height="6" rx="3" fill="#334155" />
  </g>

  <!-- TV Stand Legs -->
  <polygon points="120,384 100,432 136,432 148,384" fill="#334155" stroke="#1E293B" stroke-width="3" />
  <polygon points="392,384 412,432 376,432 364,384" fill="#334155" stroke="#1E293B" stroke-width="3" />

  <!-- Bottom App Name Label -->
  <text x="256" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#F8FAFC" letter-spacing="1">
    안전 교육 영상
  </text>
</svg>
